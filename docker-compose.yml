services:
  foodvision-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    ports:
      - "8000:8000"
    environment:
      FOODVISION_CONFIG: configs/quickstart.yaml
      FOODVISION_CHECKPOINT: artifacts/quickstart/resnet50-frozen/best.pt
    volumes:
      - ./artifacts:/app/artifacts:ro

  foodvision-cuda:
    profiles: ["cuda"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
    ports:
      - "8000:8000"
    environment:
      FOODVISION_CONFIG: configs/base.yaml
      FOODVISION_CHECKPOINT: artifacts/resnet50/partial/best.pt
    volumes:
      - ./artifacts:/app/artifacts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

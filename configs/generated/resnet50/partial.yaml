data:
  augmentation: strong
  batch_size: 32
  dataset: food101
  download: true
  image_size: 224
  num_workers: 4
  root: data
  subset_fraction: 1.0
  val_fraction: 0.1
inference:
  backend: pytorch
  checkpoint: artifacts/resnet50/partial/best.pt
  onnx_model: artifacts/resnet50/partial/model.onnx
  top_k: 5
  warmup_iterations: 5
model:
  dropout: 0.2
  fine_tune: partial
  gradient_checkpointing: false
  name: resnet50
  num_classes: 101
  pretrained: true
  unfreeze_blocks: 1
project:
  name: foodvision-resnet50-partial
  output_dir: artifacts/resnet50/partial
  seed: 42
tracking:
  experiment_name: foodvision-food101
  mlflow: true
  mlflow_uri: sqlite:///mlflow.db
  tensorboard: true
  wandb: false
  wandb_project: foodvision-production-platform
training:
  accumulation_steps: 1
  backbone_learning_rate: 3.0e-05
  cutmix_alpha: 1.0
  early_stopping_patience: 5
  epochs: 20
  gradient_clip_norm: 1.0
  label_smoothing: 0.1
  learning_rate: 0.0003
  mixup_alpha: 0.2
  precision: auto
  resume_from: null
  warmup_epochs: 2
  weight_decay: 0.05

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodvision-production-platform"
version = "0.1.0"
description = "Production-grade Food-101 training, optimization, evaluation, and serving platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chetan"}]
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "timm>=1.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14", "tensorboard>=2.17", "wandb>=0.17"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.3"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
all = [
  "mlflow>=2.14", "tensorboard>=2.17", "wandb>=0.17",
  "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.3",
  "pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"
]

[project.scripts]
foodvision-train = "foodvision.training.cli:main"
foodvision-api = "foodvision.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foodvision = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
